[project]
name = "rag-demo-backend"
version = "0.1.0"
description = "Simple RAG chatbot demo backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "sentence-transformers>=3.3.0",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "chromadb>=1.5.9",
    "nemoguardrails>=0.23.0",
]

[project.scripts]
rag-demo = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "locust>=2.46.3",
    "playwright>=1.62.0",
]
